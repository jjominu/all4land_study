<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <title>OpenLayers 개방海 지도</title>
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.4.3/css/ol.css">
    <style>
      #map {
        width: 100%;
        height: 800px;
      }
    </style>
    <script
      src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.4.3/build/ol.js">
    </script>
  </head>
  <body>
    <h2>OpenLayers + 개방海 베이스맵</h2>
    <div id="map"></div>

    <script type="text/javascript">
      // ===== 개방海 BASEMAP (EPSG:3857) =====
      const khoaBaseMap = new ol.layer.Tile({
        title: "KHOA 개방海 실시간 베이스맵",
        source: new ol.source.TileWMS({
          url: "http://www.khoa.go.kr/oceanmap/BASEMAP_RLTM3857/otmsBasemapApi.do",
          params: {
            SERVICE: "WMS",
            REQUEST: "GetMap",
            VERSION: "1.1.1",
            LAYERS: "BASEMAP_RLTM3857",
            FORMAT: "image/png",
            TRANSPARENT: false,
            TILED: true,
            SRS: "EPSG:3857",
            ServiceKey: "F062497BC44DD448FDAE699EE7E6A8B1" 
          },
          crossOrigin: "anonymous"
        })
      });

      // ===== 회색지도 (vWorld 예시) =====
      const grayMap = new ol.layer.Tile({
        title: "회색지도(vWorld)",
        source: new ol.source.XYZ({
          url: "http://xdworld.vworld.kr:8080/2d/gray/202002/{z}/{x}/{y}.png"
        })
      });

      // ===== 지도 객체 생성 =====
      const map = new ol.Map({
        target: "map",
        layers: [khoaBaseMap], // 개방海 베이스맵만 표시
        view: new ol.View({
          projection: "EPSG:3857",
          center: [14126669.41589247, 4493404.190498611], // 한반도 중심쯤
          zoom: 7,
          minZoom: 7,
          maxZoom: 19
        })
      });
    </script>
  </body>
</html>
