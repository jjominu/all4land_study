<html xmlns="http://www.w3.org/1999/xhtml" lang="ko">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>WFSTest - KHOA + GeoServer WMS</title>

  <!-- ✅ 필수 스크립트 로딩 -->
  <script src="jquery-3.1.1.min.js" type="text/javascript"></script>
  <script src="OpenLayers.js" type="text/javascript"></script>
  <script src="http://www.khoa.go.kr/oceanmap/js/proj4js-1.1.0/lib/proj4js.js" type="text/javascript"></script>
  <script src="http://www.khoa.go.kr/oceanmap/js/proj4js-1.1.0/lib/defs/EPSG5179.js" type="text/javascript"></script>
  <script src="http://www.khoa.go.kr/oceanmap/js/gis/OtmsApi.js" type="text/javascript"></script>

  <!-- ✅ 개방海 베이스맵 -->
  <script src="http://www.khoa.go.kr/oceanmap/BASEMAP/otmsBasemapApi.do?ServiceKey=F062497BC44DD448FDAE699EE" type="text/javascript"></script>

  <style>
    html, body { margin:0; padding:0; height:100%; }
    #map { width:100%; height:100%; }
  </style>

  <script type="text/javascript">
  /******************************************************
   * ✅ 전역 설정 (모든 함수보다 위에서 반드시 선언)
   ******************************************************/
  var GS_WMS_URL = "http://localhost:9090/geoserver/map/wms"; // GeoServer WMS 주소
  var GS_LAYER_NAME = "map:places";                           // 네임스페이스:레이어명
  var KHOA_WFS_SERVICE_KEY = "2CFD93CC10232E97916E89B14";     // 개방海 WFS 키

  // ---------------------------------------------------
  // 지도 전역 변수
  // ---------------------------------------------------
  var map;
  var OtmsLayer;
  var selectControl = null;

  // 기본 좌표 및 줌
  var mapCenterX='956498.5710969';
  var mapCenterY='1819967.0629328';
  var numZoomLevels = 11;
  var zoomLevel = 1;
  var minZoomLevel = 0;

  // 지도 영역 (위경도 기준)
  var mapBounds = new OpenLayers.Bounds(123, 32, 132, 43);

  // 타일 로드 실패 대응
  OpenLayers.IMAGE_RELOAD_ATTEMPTS = 3;
  OpenLayers.Util.onImageLoadErrorColor = "transparent";

  /******************************************************
   * ✅ 초기화 함수
   ******************************************************/
  function init(){
      var options = {
          projection : new OpenLayers.Projection("EPSG:5179"),
          displayProjection: new OpenLayers.Projection("EPSG:4326"),
          maxExtent : new OpenLayers.Bounds(-200000.0, -3015.4524, 3803015.4524, 4000000.0),
          restrictedExtent : new OpenLayers.Bounds(37953.1466, 1126946.7253, 2152527.8074, 2873292.7040),
          center : new OpenLayers.LonLat(mapCenterX, mapCenterY),
          allOverlays: true,
          maxResolution : 1954.597389,
          numZoomLevels: numZoomLevels,
          zoom : zoomLevel,
          minZoom : minZoomLevel,
          transitionEffect : null,
          layers : [ OtmsLayer ],
          controls : []
      };
      map = new OpenLayers.Map('map', options);

      // 개방海 베이스맵 추가
      if (typeof window.OtmsLayer !== "undefined" && window.OtmsLayer) {
        map.addLayer(window.OtmsLayer);
      } else {
        alert("개방海 베이스맵을 불러오지 못했습니다.");
      }

      // 기본 컨트롤 추가
      map.addControl(new OpenLayers.Control.Navigation());
      map.addControl(new OpenLayers.Control.LayerSwitcher());
      map.addControl(new OpenLayers.Control.ScaleLine());
      map.addControl(new OpenLayers.Control.Attribution());

      // 초기 영역 설정
      map.zoomToExtent(mapBounds.transform(map.displayProjection, map.projection));
      map.setCenter([mapCenterX,mapCenterY], minZoomLevel);
      map.zoomTo(1);

      // ✅ GeoServer WMS 오버레이 추가
      addGeoServerWMS();

      // ✅ 개방海 WFS 호출
      getWFS();
  }

  /******************************************************
   * ✅ GeoServer WMS 오버레이 추가
   ******************************************************/
  function addGeoServerWMS() {
      var wmsParams = {
          layers: GS_LAYER_NAME,
          format: "image/png",
          transparent: true,
          srs: "EPSG:5179"
      };
      var wmsOptions = {
          isBaseLayer: false,
          singleTile: false,
          ratio: 1.0,
          transitionEffect: null
      };
      var wmsLayer = new OpenLayers.Layer.WMS("GeoServer(map:places)", GS_WMS_URL, wmsParams, wmsOptions);
      map.addLayer(wmsLayer);
  }

  /******************************************************
   * ✅ KHOA WFS 호출
   ******************************************************/
  function getWFS() {
      var layerName = "TL_FIRSTA_P";
      var url = "http://www.khoa.go.kr/oceanmap/otmsWfsApi.do";
          url += "?ServiceKey=" + encodeURIComponent(KHOA_WFS_SERVICE_KEY);
          url += "&Layer=" + encodeURIComponent(layerName);

      $.ajax({
          async:true,
          cache:false,
          type:"GET",
          url:encodeURI(url),
          dataType:"text",
          success:function(response) {
              parseGML(response, layerName);
          },
          error:function() {
              alert("처리오류로 인해 WFS정보를 가져오지 못했습니다.");
          }
      });
  }

  /******************************************************
   * ✅ GML 파싱 및 벡터 표시
   ******************************************************/
  function parseGML(response, layerName) {
      var g = new OpenLayers.Format.GML();
      var features = g.read(response);

      var renderer = OpenLayers.Util.getParameters(window.location.href).renderer;
      renderer = (renderer) ? [renderer] : OpenLayers.Layer.Vector.prototype.renderers;

      // 심볼 스타일 지정
      var styleMap = new OpenLayers.StyleMap({
        "default": new OpenLayers.Style({
           pointRadius: 6,
           fillColor: "#1e90ff",
           fillOpacity: 0.7,
           strokeColor: "#004a9f",
           strokeWidth: 2
        }),
        "select": new OpenLayers.Style({
           pointRadius: 8,
           fillColor: "#ff8800",
           strokeColor: "#cc5500",
           strokeWidth: 2
        })
      });

      var layer = new OpenLayers.Layer.Vector(layerName, { styleMap: styleMap, renderers: renderer });
      layer.addFeatures(features);
      map.addLayer(layer);

      // SelectFeature 컨트롤 (중복 제거)
      if (selectControl) {
        try { selectControl.deactivate(); map.removeControl(selectControl); } catch(e){}
      }
      selectControl = new OpenLayers.Control.SelectFeature(layer);
      map.addControl(selectControl);
      selectControl.activate();

      layer.events.on({
          'featureselected': onFeatureSelect,
          'featureunselected': onFeatureUnselect
      });

      function onPopupClose(evt) {
          var feature = this.feature;
          if (feature.layer) selectControl.unselect(feature);
          this.destroy();
      }

      function onFeatureSelect(evt) {
          var feature = evt.feature;
          var nm   = feature.data.NM   || "정보 없음";
          var addr = feature.data.ADDR || "";

          var popupHtml = "<h3>" + nm + "</h3><p>" + addr + "</p>";
          var popup = new OpenLayers.Popup.FramedCloud(
              "featurePopup",
              feature.geometry.getBounds().getCenterLonLat(),
              new OpenLayers.Size(120,100),
              popupHtml,
              null, true, onPopupClose
          );
          feature.popup = popup;
          popup.feature = feature;
          map.addPopup(popup, true);
      }

      function onFeatureUnselect(evt) {
          var feature = evt.feature;
          if (feature.popup) {
              map.removePopup(feature.popup);
              feature.popup.destroy();
              feature.popup = null;
          }
      }
  }

  // ---------------------------------------------------
  // 페이지 로드 시 init() 실행
  // ---------------------------------------------------
  window.onload = init;
  </script>
</head>

<body>
  <div id="map"></div>
</body>
</html>
